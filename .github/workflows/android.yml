name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: License check
        run: |
          grep -q "PolyForm-Noncommercial-1.0.0" LICENSE && echo "LICENSE: PolyForm Noncommercial 1.0.0 OK"
          grep -q "source-available for noncommercial use" README.md && echo "README: source-available notice OK"
          grep -q "PolyForm-Noncommercial-1.0.0" COMMERCIAL_LICENSE.md && echo "COMMERCIAL_LICENSE: OK"
          grep -q "not currently accepted" CONTRIBUTING.md && echo "CONTRIBUTING: contributions policy OK"
          grep -rq "SPDX-License-Identifier" app/src/main/kotlin && echo "SPDX headers: OK"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/LumaDepth-debug.apk
          ls -la artifacts/

      - name: Verify merged manifest has no unnecessary permissions
        run: |
          MANIFEST=app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            if grep -q "READ_MEDIA_IMAGES\|READ_MEDIA_VIDEO\|READ_MEDIA_VISUAL_USER_SELECTED\|READ_EXTERNAL_STORAGE\|WRITE_EXTERNAL_STORAGE\|MANAGE_EXTERNAL_STORAGE\|android.permission.INTERNET" "$MANIFEST"; then
              echo "FAIL: unnecessary permission found in merged manifest"
              grep -n "permission" "$MANIFEST"
              exit 1
            fi
            echo "Manifest permission check: OK (no storage/network permissions)"
          else
            echo "merged manifest not found at expected path, searching..."
            find app/build/intermediates -name "AndroidManifest.xml" | head -5
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaDepth-debug-apk
          path: artifacts/LumaDepth-debug.apk
          if-no-files-found: error
